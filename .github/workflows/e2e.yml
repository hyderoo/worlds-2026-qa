name: e2e
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to test"
        default: "https://worlds-2026-live.vercel.app"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://worlds-2026-live.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        run: node scripts/summarize.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            evidence
            test-results
          retention-days: 30
